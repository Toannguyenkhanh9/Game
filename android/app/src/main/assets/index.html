<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Core Ball - Gold Promo FX</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <style type="text/css">
        :root {
            --bg: #020611;
            --panel: #0a1028;
            --blue: #43c7ff;
            --blue2: #1478ff;
            --violet: #c65cff;
            --violet2: #6f25ff;
            --gold: #ffd95a;
            --text: #f7fbff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020611 !important;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
            user-select: none;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 34%, rgba(86, 36, 187, .26) 0 18%, transparent 46%),
                radial-gradient(circle at 50% 60%, rgba(18, 125, 255, .15), transparent 55%),
                linear-gradient(180deg, #05091b 0%, #02040d 72%, #010207 100%) !important;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .72;
            background-image:
                radial-gradient(circle at 12% 15%, rgba(82, 197, 255, .9) 0 1px, transparent 2px),
                radial-gradient(circle at 81% 18%, rgba(193, 91, 255, .9) 0 1px, transparent 2px),
                radial-gradient(circle at 73% 71%, rgba(72, 141, 255, .75) 0 1px, transparent 2px),
                radial-gradient(circle at 22% 82%, rgba(207, 91, 255, .75) 0 1px, transparent 2px),
                radial-gradient(circle at 50% 42%, rgba(255,255,255,.55) 0 1px, transparent 2px);
            background-size: 190px 210px, 250px 260px, 220px 240px, 290px 280px, 180px 190px;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(54, 125, 255, .045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(54, 125, 255, .045) 1px, transparent 1px);
            background-size: 38px 38px;
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 72%);
            mask-image: radial-gradient(circle at center, black, transparent 72%);
        }

        .sparks {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 32%, rgba(94,211,255,.85) 0 1px, transparent 2px),
                radial-gradient(circle at 86% 44%, rgba(220,98,255,.8) 0 1px, transparent 2px),
                radial-gradient(circle at 64% 19%, rgba(255,255,255,.7) 0 1px, transparent 2px),
                radial-gradient(circle at 35% 76%, rgba(113,88,255,.75) 0 1px, transparent 2px);
            animation: floatSparks 7s ease-in-out infinite alternate;
        }

        @keyframes floatSparks {
            from { transform: translateY(-5px); opacity: .65; }
            to { transform: translateY(8px); opacity: 1; }
        }

        #stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #begin {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(18px, env(safe-area-inset-top)) 24px max(18px, env(safe-area-inset-bottom));
            background: transparent !important;
        }

        .home-card {
            width: min(92vw, 430px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-1.5vh);
        }

        .core-emblem {
            position: relative;
            width: clamp(172px, 46vw, 225px);
            aspect-ratio: 1;
            margin-bottom: -18px;
            display: grid;
            place-items: center;
            filter: drop-shadow(0 0 24px rgba(59, 130, 255, .48));
        }

        .core-orbit,
        .core-orbit::before,
        .core-orbit::after {
            position: absolute;
            border-radius: 50%;
        }

        .core-orbit {
            inset: 4%;
            border: 2px solid rgba(77, 181, 255, .7);
            box-shadow: 0 0 22px rgba(35, 158, 255, .75), inset 0 0 22px rgba(86, 50, 255, .45);
            animation: orbitSpin 10s linear infinite;
        }

        .core-orbit::before {
            content: '';
            inset: 10%;
            border: 3px solid rgba(188, 80, 255, .78);
            border-left-color: transparent;
            border-bottom-color: transparent;
            box-shadow: 0 0 20px rgba(193, 74, 255, .7);
        }

        .core-orbit::after {
            content: '';
            width: 16px;
            height: 16px;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: #e77bff;
            box-shadow: 0 0 18px #d94cff, 0 0 34px #7b3cff;
        }

        @keyframes orbitSpin { to { transform: rotate(360deg); } }

        .core-shell {
            position: relative;
            width: 58%;
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, #f9ffff 0 4%, #48d5ff 5% 10%, #0869df 11% 29%, #12214c 31% 58%, #11172e 60% 100%);
            border: 7px solid #707a98;
            box-shadow:
                0 0 0 7px #11172a,
                0 0 0 10px rgba(79, 175, 255, .65),
                0 0 34px rgba(38, 152, 255, .9),
                inset 0 0 25px rgba(66, 194, 255, .75);
        }

        .core-shell::before,
        .core-shell::after {
            content: '';
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            border: 2px solid rgba(112, 217, 255, .65);
        }

        .core-shell::after {
            inset: 31%;
            background: #dfffff;
            border: 0;
            box-shadow: 0 0 12px #7deaff, 0 0 32px #168aff, 0 0 54px #824aff;
        }

        .title-frame {
            position: relative;
            width: 100%;
            padding: 18px 12px 15px;
            text-align: center;
            background: linear-gradient(180deg, rgba(17, 26, 62, .98), rgba(4, 8, 24, .98));
            border: 2px solid rgba(91, 183, 255, .85);
            clip-path: polygon(7% 0, 93% 0, 100% 25%, 100% 75%, 93% 100%, 7% 100%, 0 75%, 0 25%);
            box-shadow: 0 0 18px rgba(58, 132, 255, .45), inset 0 0 16px rgba(171, 71, 255, .18);
            margin-bottom: 22px;
        }

        .title-frame::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px solid rgba(199, 95, 255, .38);
            clip-path: inherit;
            pointer-events: none;
        }

        .logo-text {
            position: relative;
            z-index: 1;
            display: inline-block;
            font-size: clamp(38px, 10vw, 58px);
            line-height: .92;
            letter-spacing: -1.5px;
            font-weight: 1000;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #83d9ff 35%, #367cff 51%, #dd7cff 53%, #8635d8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 7px 0 rgba(0,0,0,.3);
            filter: drop-shadow(0 0 7px rgba(79, 175, 255, .55));
        }

        .level-shell {
            position: relative;
            min-width: 220px;
            padding: 13px 34px;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(180deg, #11162f, #080b1d);
            border: 1px solid #b37aff;
            clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
            box-shadow: 0 0 18px rgba(158, 78, 255, .38), inset 0 0 12px rgba(74, 120, 255, .2);
        }

        .level-shell::before,
        .level-shell::after {
            content: '‹';
            position: absolute;
            top: 50%;
            transform: translateY(-54%);
            color: #d894ff;
            font-size: 30px;
            text-shadow: 0 0 10px #a235ff;
        }
        .level-shell::before { left: 14px; }
        .level-shell::after { right: 14px; content: '›'; }

        .text {
            font-size: clamp(22px, 6vw, 30px);
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(108, 201, 255, .55);
            white-space: nowrap;
        }

        .button {
            position: relative;
            width: min(82vw, 340px);
            height: 88px;
            padding: 4px;
            margin-bottom: 22px;
            cursor: pointer;
            clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
            background: linear-gradient(90deg, #38a9ff, #dd61ff, #7840ff, #38a9ff);
            box-shadow: 0 0 25px rgba(190, 73, 255, .7), 0 10px 30px rgba(0,0,0,.7);
            animation: playPulse 2.2s ease-in-out infinite;
        }

        @keyframes playPulse {
            0%, 100% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(1.13); transform: scale(1.015); }
        }

        .button:active { transform: scale(.97); animation: none; }

        .btn-inner {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            clip-path: inherit;
            background:
                linear-gradient(180deg, rgba(225, 109, 255, .95), rgba(92, 25, 213, .98));
            border: 2px solid rgba(255,255,255,.55);
            box-shadow: inset 0 0 22px rgba(255,255,255,.2), inset 0 -12px 22px rgba(41,0,100,.35);
        }

        #txtAr {
            color: #fff;
            font-size: clamp(33px, 9vw, 45px);
            font-weight: 1000;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 3px 0 rgba(53, 14, 100, .65), 0 0 10px rgba(255,255,255,.3);
            pointer-events: none;
        }

        .btn-reset-ui {
            width: 180px;
            height: 54px;
            padding: 2px;
            cursor: pointer;
            clip-path: polygon(12% 0, 88% 0, 100% 50%, 88% 100%, 12% 100%, 0 50%);
            background: linear-gradient(90deg, #62d3ff, #8a62ff, #62d3ff);
            box-shadow: 0 0 13px rgba(62, 165, 255, .35);
        }

        .btn-reset-ui:active { transform: scale(.97); }

        .btn-reset-inner {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            clip-path: inherit;
            background: linear-gradient(180deg, #101833, #070b1c);
            color: #bcecff;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 2, 12, .88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-box {
            width: min(88vw, 340px);
            padding: 3px;
            background: linear-gradient(135deg, #41c8ff, #c75aff, #5a43ff);
            clip-path: polygon(7% 0, 93% 0, 100% 10%, 100% 90%, 93% 100%, 7% 100%, 0 90%, 0 10%);
            box-shadow: 0 0 28px rgba(106, 83, 255, .65);
            animation: popIn .22s ease-out;
        }

        .modal-box-inner {
            padding: 25px 20px;
            text-align: center;
            color: #fff;
            background: linear-gradient(180deg, #111a3b, #070b1d);
            clip-path: inherit;
        }

        
        .revive-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 0 18px;
        }

        .revive-icon {
            width: 74px;
            height: 74px;
            display: grid;
            place-items: center;
            margin-bottom: 10px;
            border-radius: 50%;
            font-size: 34px;
            font-weight: 900;
            color: #fff7d2;
            background: radial-gradient(circle at 32% 28%, #fff7d6, #f0b52a 35%, #8f4700 72%, #3a1b00 100%);
            border: 2px solid rgba(255, 244, 190, .76);
            box-shadow: 0 0 18px rgba(255, 174, 18, .65), inset 0 0 20px rgba(255, 246, 203, .22);
        }

        .revive-title {
            font-size: 20px;
            font-weight: 1000;
            letter-spacing: .4px;
            color: #fff1bc;
            text-shadow: 0 0 10px rgba(255, 183, 32, .42);
        }

        .revive-sub {
            margin-top: 4px;
            font-size: 12px;
            color: rgba(255, 229, 166, .82);
            letter-spacing: .4px;
        }

.modal-box-inner p {
            font-size: 18px;
            line-height: 1.5;
            font-weight: 800;
            margin-bottom: 23px;
        }

        .modal-buttons { display: flex; gap: 12px; }

        .btn-modal {
            flex: 1;
            min-height: 48px;
            padding: 9px 7px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-yes { background: linear-gradient(180deg, #ca64ff, #6626d9); }
        .btn-no { background: linear-gradient(180deg, #25345f, #10172f); }
        .btn-modal:active { transform: translateY(2px); }
        .btn-modal:disabled { opacity: .55; pointer-events: none; }

        #reviveModal { z-index: 999999 !important; }
        #reviveModal .modal-box { pointer-events: auto; }

        @keyframes popIn {
            from { transform: scale(.88); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-height: 720px) {
            .home-card { transform: scale(.86); }
        }

        @media (max-height: 620px) {
            .home-card { transform: scale(.76); }
        }

        @media (prefers-reduced-motion: reduce) {
            .sparks, .core-orbit, .button { animation: none !important; }
        }

        /* Promo-video gold theme override */
        body {
            background:
                radial-gradient(circle at 50% 34%, rgba(255, 172, 28, .16) 0 16%, transparent 45%),
                radial-gradient(circle at 50% 65%, rgba(151, 77, 0, .12), transparent 56%),
                linear-gradient(180deg, #070401 0%, #020100 76%, #000 100%) !important;
        }
        body::before {
            opacity: .8;
            background-image:
                radial-gradient(circle at 12% 15%, rgba(255, 211, 89, .85) 0 1px, transparent 2px),
                radial-gradient(circle at 81% 18%, rgba(255, 151, 20, .75) 0 1px, transparent 2px),
                radial-gradient(circle at 73% 71%, rgba(255, 218, 106, .68) 0 1px, transparent 2px),
                radial-gradient(circle at 22% 82%, rgba(255, 128, 0, .60) 0 1px, transparent 2px),
                radial-gradient(circle at 50% 42%, rgba(255, 248, 199, .55) 0 1px, transparent 2px);
        }
        body::after {
            background:
                linear-gradient(rgba(255, 180, 38, .028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 180, 38, .028) 1px, transparent 1px);
            background-size: 38px 38px;
        }
        .sparks {
            background:
                radial-gradient(circle at 18% 32%, rgba(255,214,93,.80) 0 1px, transparent 2px),
                radial-gradient(circle at 86% 44%, rgba(255,143,13,.76) 0 1px, transparent 2px),
                radial-gradient(circle at 64% 19%, rgba(255,251,222,.72) 0 1px, transparent 2px),
                radial-gradient(circle at 35% 76%, rgba(255,174,28,.70) 0 1px, transparent 2px);
        }
        .core-emblem { filter: drop-shadow(0 0 24px rgba(255, 165, 18, .52)); }
        .core-orbit {
            border-color: rgba(255, 205, 82, .78);
            box-shadow: 0 0 22px rgba(255, 164, 20, .72), inset 0 0 22px rgba(132, 66, 0, .52);
        }
        .core-orbit::before {
            border-color: rgba(255, 185, 38, .84);
            border-left-color: transparent;
            border-bottom-color: transparent;
            box-shadow: 0 0 20px rgba(255, 139, 10, .72);
        }
        .core-orbit::after {
            background: #fff1a4;
            box-shadow: 0 0 18px #ffc33a, 0 0 34px #ff8b00;
        }
        .core-shell {
            background: radial-gradient(circle at 50% 50%, #fffce3 0 4%, #ffe06a 5% 10%, #d88705 11% 29%, #4d2902 31% 58%, #130a00 60% 100%);
            border-color: #ad7927;
            box-shadow: 0 0 0 7px #150c01, 0 0 0 10px rgba(255,190,55,.66), 0 0 34px rgba(255,149,10,.9), inset 0 0 25px rgba(255,211,84,.68);
        }
        .core-shell::before { border-color: rgba(255, 226, 120, .68); }
        .core-shell::after { background: #fffbd7; box-shadow: 0 0 12px #ffe781, 0 0 32px #ffb018, 0 0 54px #bd6100; }
        .title-frame {
            background: linear-gradient(180deg, rgba(38,22,3,.98), rgba(8,4,0,.98));
            border-color: rgba(255,198,70,.9);
            box-shadow: 0 0 18px rgba(255,152,18,.48), inset 0 0 16px rgba(255,198,68,.12);
        }
        .title-frame::after { border-color: rgba(255, 177, 43, .42); }
        .logo-text {
            background: linear-gradient(180deg, #fffce6 0%, #ffe780 35%, #f5a90d 56%, #9f4f00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255,168,23,.62));
        }
        .level-shell {
            background: linear-gradient(180deg, #241503, #090500);
            border-color: #e5a72a;
            box-shadow: 0 0 18px rgba(255,153,20,.32), inset 0 0 12px rgba(255,193,58,.12);
        }
        .level-shell::before, .level-shell::after { color:#ffd66a; text-shadow:0 0 10px #ff9a00; }
        .text { color:#fff2b5; text-shadow:0 0 10px rgba(255,181,39,.58); }
        .button {
            background: linear-gradient(90deg, #9e5200, #ffd25a, #f39b08, #9e5200);
            box-shadow: 0 0 26px rgba(255,159,16,.66), 0 10px 30px rgba(0,0,0,.72);
        }
        .btn-inner {
            background: linear-gradient(180deg, rgba(255,202,67,.98), rgba(189,91,0,.98));
            border-color: rgba(255,248,194,.72);
            box-shadow: inset 0 0 22px rgba(255,255,220,.22), inset 0 -12px 22px rgba(75,31,0,.35);
        }
        #txtAr { color:#fff8d8; text-shadow:0 3px 0 rgba(85,37,0,.7), 0 0 12px rgba(255,246,186,.38); }
        .btn-reset-ui { background:linear-gradient(90deg,#8a4a00,#e9ae2a,#8a4a00); box-shadow:0 0 13px rgba(255,164,25,.35); }
        .btn-reset-inner { background:linear-gradient(180deg,#211302,#080400); color:#ffe49a; }
        .modal-overlay { background:rgba(3,2,0,.9); }
        .modal-box { background:linear-gradient(135deg,#9e5600,#ffd565,#c17400); box-shadow:0 0 28px rgba(255,157,21,.62); }
        .modal-box-inner { background:linear-gradient(180deg,#261703,#090500); color:#fff5c6; }
        .btn-yes { background:linear-gradient(180deg,#f3b82d,#a75200); }
        .btn-no { background:linear-gradient(180deg,#40311c,#171007); }



        /* ===== Promo-level in-game presentation ===== */
        #stage {
            transform-origin: 50% 50%;
            will-change: transform, filter;
        }

        #stage.shake-soft { animation: stageShakeSoft .16s ease-out; }
        #stage.shake-hard { animation: stageShakeHard .34s cubic-bezier(.2,.8,.2,1); }

        @keyframes stageShakeSoft {
            0%,100% { transform: translate3d(0,0,0) scale(1); }
            25% { transform: translate3d(-3px,1px,0) scale(1.004); }
            55% { transform: translate3d(3px,-1px,0) scale(1.004); }
            78% { transform: translate3d(-1px,1px,0) scale(1.002); }
        }

        @keyframes stageShakeHard {
            0%,100% { transform: translate3d(0,0,0) scale(1); filter: brightness(1); }
            10% { transform: translate3d(-8px,3px,0) scale(1.012); filter: brightness(1.18); }
            23% { transform: translate3d(7px,-4px,0) scale(1.01); }
            38% { transform: translate3d(-6px,-2px,0) scale(1.008); }
            54% { transform: translate3d(5px,3px,0) scale(1.006); }
            70% { transform: translate3d(-3px,1px,0) scale(1.004); }
            85% { transform: translate3d(2px,-1px,0) scale(1.002); }
        }

        .promo-hud {
            position: fixed;
            z-index: 25;
            top: max(10px, env(safe-area-inset-top));
            left: 0;
            width: 100%;
            height: 84px;
            padding: 0 18px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            pointer-events: none;
            opacity: 0;
            transform: translateY(-12px);
            transition: opacity .22s ease, transform .22s ease;
        }

        .promo-hud.show {
            opacity: 1;
            transform: translateY(0);
        }

        .promo-hud-side {
            width: 74px;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: #fff0b4;
            font-size: 13px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 167, 18, .55);
        }

        .promo-coin {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #5b2b00;
            font-size: 11px;
            background: radial-gradient(circle at 32% 28%, #fff7ca, #f6ba31 38%, #9a4c00 78%);
            border: 1px solid rgba(255, 244, 185, .85);
            box-shadow: 0 0 12px rgba(255, 178, 27, .5);
        }

        .promo-hud-center {
            min-width: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2px;
        }

        .promo-hud-level {
            color: #fff7d5;
            font-size: 17px;
            line-height: 22px;
            font-weight: 900;
            letter-spacing: .4px;
            text-shadow: 0 0 12px rgba(255, 177, 30, .55), 0 2px 3px rgba(0,0,0,.75);
        }

        .promo-progress-track {
            position: relative;
            width: 116px;
            height: 5px;
            margin-top: 7px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 227, 155, .15);
            border: 1px solid rgba(255, 211, 102, .26);
            box-shadow: inset 0 0 8px rgba(0,0,0,.45);
        }

        .promo-progress-bar {
            width: 38%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #b96900, #ffd76a, #fff4bd);
            box-shadow: 0 0 10px rgba(255, 179, 30, .76);
            transition: width .35s ease;
        }

        .promo-pause {
            margin-left: auto;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 220, 134, .52);
            background: radial-gradient(circle, rgba(72,41,8,.78), rgba(15,8,1,.92));
            box-shadow: 0 0 12px rgba(255, 173, 26, .25), inset 0 0 8px rgba(255,220,125,.1);
        }

        .promo-pause::before {
            content: '';
            width: 10px;
            height: 12px;
            border-left: 3px solid #ffe7a0;
            border-right: 3px solid #ffe7a0;
            filter: drop-shadow(0 0 4px rgba(255,180,37,.55));
        }

        .sound-toggle {
            position: fixed;
            z-index: 80;
            top: max(56px, calc(env(safe-area-inset-top) + 48px));
            right: 16px;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid rgba(255, 220, 130, .62);
            border-radius: 50%;
            cursor: pointer;
            color: #fff0b1;
            background: radial-gradient(circle at 38% 30%, rgba(112, 65, 11, .94), rgba(24, 12, 1, .96) 72%);
            box-shadow:
                0 0 15px rgba(255, 176, 25, .28),
                inset 0 0 10px rgba(255, 221, 125, .10);
            -webkit-tap-highlight-color: transparent;
            transition: transform .12s ease, filter .18s ease, opacity .18s ease;
        }

        .sound-toggle:active { transform: scale(.92); }
        .sound-toggle svg { width: 23px; height: 23px; overflow: visible; pointer-events: none; }
        .sound-toggle .speaker-body,
        .sound-toggle .sound-wave {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px rgba(255, 185, 38, .45));
        }
        .sound-toggle .mute-slash { display: none; stroke: #ffb12e; stroke-width: 2.4; stroke-linecap: round; }
        .sound-toggle.is-muted { color: rgba(255, 225, 157, .52); filter: saturate(.55); }
        .sound-toggle.is-muted .sound-wave { opacity: .18; }
        .sound-toggle.is-muted .mute-slash { display: block; }

        @media (max-width: 380px) {
            .sound-toggle { right: 10px; width: 40px; height: 40px; }
        }

        #promoTapLayer {
            position: fixed;
            inset: 0;
            z-index: 35;
            pointer-events: none;
            overflow: hidden;
        }

        .promo-tap-ripple {
            position: absolute;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #fff8d5;
            box-shadow: 0 0 10px #fff1a4, 0 0 24px rgba(255,171,25,.95);
            animation: promoTap .5s ease-out forwards;
        }

        .promo-tap-ripple::before,
        .promo-tap-ripple::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            transform: translate(-50%,-50%);
        }

        .promo-tap-ripple::before {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,229,151,.9);
            box-shadow: 0 0 14px rgba(255,172,22,.75);
        }

        .promo-tap-ripple::after {
            width: 46px;
            height: 46px;
            border: 1px solid rgba(255,185,47,.72);
        }

        .promo-tap-ripple i {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 72px;
            height: 72px;
            transform: translate(-50%,-50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,116,.16), rgba(255,166,21,0) 68%);
        }

        @keyframes promoTap {
            0% { opacity: 0; transform: translate(-50%,-50%) scale(.35); }
            18% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(1.9); }
        }

        .level-clear-overlay {
            position: fixed;
            inset: 0;
            z-index: 32;
            display: grid;
            place-items: center;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .level-clear-overlay.show {
            visibility: visible;
            animation: clearOverlayFade 1.05s ease both;
        }

        .clear-burst {
            position: absolute;
            width: min(88vw, 440px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                repeating-conic-gradient(from 0deg, rgba(255,219,121,.12) 0deg 5deg, transparent 5deg 14deg),
                radial-gradient(circle, rgba(255,243,190,.34) 0 8%, rgba(255,185,36,.17) 24%, transparent 67%);
            filter: drop-shadow(0 0 25px rgba(255,166,16,.26));
            animation: burstSpin 1.1s ease-out both;
        }

        .clear-panel {
            position: relative;
            min-width: min(78vw, 330px);
            padding: 19px 34px 17px;
            text-align: center;
            background: linear-gradient(180deg, rgba(58,34,5,.94), rgba(12,7,1,.96));
            border: 1px solid rgba(255,226,144,.78);
            clip-path: polygon(9% 0, 91% 0, 100% 24%, 100% 76%, 91% 100%, 9% 100%, 0 76%, 0 24%);
            box-shadow:
                0 0 0 3px rgba(151,79,0,.46),
                0 0 26px rgba(255,174,24,.68),
                inset 0 0 26px rgba(255,201,76,.12);
            transform: scale(.74) translateY(10px);
            animation: clearPanelPop 1.05s cubic-bezier(.18,.9,.25,1) both;
        }

        .clear-panel::before,
        .clear-panel::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 72px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,221,133,.8));
            box-shadow: 0 0 10px rgba(255,181,29,.7);
        }
        .clear-panel::before { right: 100%; }
        .clear-panel::after { left: 100%; transform: rotate(180deg); }

        .clear-small {
            display: block;
            color: #e8b858;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .clear-title {
            display: block;
            color: #fff7d3;
            font-size: clamp(30px, 8vw, 43px);
            line-height: 1;
            font-weight: 1000;
            letter-spacing: -.7px;
            text-shadow: 0 0 8px #fff4bb, 0 0 22px rgba(255,163,16,.82), 0 4px 5px rgba(0,0,0,.75);
        }

        .clear-level-number {
            display: block;
            margin-top: 7px;
            color: #f4bd4e;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2.5px;
        }

        @keyframes clearOverlayFade {
            0% { opacity: 0; }
            12%,72% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes clearPanelPop {
            0% { transform: scale(.64) translateY(14px); filter: brightness(1.7); }
            23% { transform: scale(1.07) translateY(-2px); }
            44% { transform: scale(1) translateY(0); }
            78% { transform: scale(1) translateY(0); }
            100% { transform: scale(.92) translateY(-5px); }
        }

        @keyframes burstSpin {
            0% { transform: rotate(-18deg) scale(.44); opacity: 0; }
            18% { opacity: 1; }
            100% { transform: rotate(16deg) scale(1.14); opacity: 0; }
        }

        @media (max-width: 380px) {
            .promo-hud { padding-left: 12px; padding-right: 12px; }
            .promo-hud-side { width: 58px; }
            .promo-hud-center { min-width: 145px; }
        }

        /* ===== Premium Home Background ===== */
        #begin {
            overflow: hidden;
            isolation: isolate;
        }

        #begin::before {
            content: '';
            position: absolute;
            inset: -3%;
            z-index: -2;
            background:
                linear-gradient(180deg, rgba(4,2,0,.12) 0%, rgba(4,2,0,.18) 34%, rgba(2,1,0,.50) 100%),
                url('img/home_promo_bg.png') center center / cover no-repeat;
            filter: saturate(1.05) contrast(1.04) brightness(.90);
            transform: scale(1.03);
            animation: homeBgFloat 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        #begin::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 25%, rgba(255,236,166,.16) 0%, rgba(255,176,27,.07) 23%, rgba(0,0,0,0) 46%),
                linear-gradient(180deg, rgba(0,0,0,.02) 0%, rgba(0,0,0,.10) 52%, rgba(0,0,0,.42) 100%);
        }

        @keyframes homeBgFloat {
            0% { transform: scale(1.03) translate3d(0, 0, 0); }
            100% { transform: scale(1.075) translate3d(0, -0.7%, 0); }
        }

        .home-card {
            position: relative;
            z-index: 1;
            padding: 16px 16px 24px;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(22,12,2,.20), rgba(10,5,0,.06) 45%, rgba(7,3,0,.16));
            box-shadow: 0 20px 55px rgba(0,0,0,.22);
        }

        .home-card::before {
            content: '';
            position: absolute;
            inset: 7% 9% auto 9%;
            height: 38%;
            z-index: -1;
            background: radial-gradient(circle at 50% 36%, rgba(255,218,105,.22) 0%, rgba(255,159,18,.09) 30%, rgba(0,0,0,0) 72%);
            filter: blur(10px);
            pointer-events: none;
        }

        .core-emblem {
            filter: drop-shadow(0 0 28px rgba(255, 173, 24, .66)) !important;
        }

        .title-frame {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 22px rgba(255,152,18,.44), 0 10px 28px rgba(0,0,0,.26), inset 0 0 18px rgba(255,198,68,.12) !important;
        }

        .level-shell {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 0 18px rgba(255,153,20,.34), 0 8px 20px rgba(0,0,0,.22), inset 0 0 12px rgba(255,193,58,.12) !important;
        }

        .button {
            box-shadow: 0 0 34px rgba(255,159,16,.72), 0 14px 34px rgba(0,0,0,.50) !important;
        }

        @media (prefers-reduced-motion: reduce) {
            #begin::before { animation: none !important; }
        }

    </style>
</head>

    function detectLanguage() {
        const raw = (
            navigator.languages && navigator.languages.length
                ? navigator.languages[0]
                : navigator.language || 'en'
        ).toLowerCase();

        const base = raw.split('-')[0];

        if (I18N[raw]) return raw;
        if (base === 'tl') return 'fil';
        if (I18N[base]) return base;

        return 'en';
    }

    const currentLang = detectLanguage();

    function t(key) {
        return (I18N[currentLang] && I18N[currentLang][key]) ||
            (I18N.en && I18N.en[key]) ||
            key;
    }

    function applyI18n() {
        document.documentElement.lang = currentLang;
        document.title = t('pageTitle');

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            el.textContent = t(el.getAttribute('data-i18n'));
        });

        document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
            el.innerHTML = t(el.getAttribute('data-i18n-html'));
        });
    }

    window.CoreBallI18n = {
        lang: currentLang,
        messages: I18N,
        t: t,
        apply: applyI18n
    };

    applyI18n();
})();
</script>
    <script>
        const btnResetShowPopup = document.getElementById('btnResetShowPopup');
        const confirmModal = document.getElementById('confirmModal');
        const btnConfirmYes = document.getElementById('btnConfirmYes');
        const btnConfirmNo = document.getElementById('btnConfirmNo');
        const realBtnReset = document.getElementById('btnReset');

        if (btnResetShowPopup && confirmModal) {
            btnResetShowPopup.addEventListener('click', function () {
                confirmModal.style.display = 'flex';
            });
        }

        if (btnConfirmNo && confirmModal) {
            btnConfirmNo.addEventListener('click', function () {
                confirmModal.style.display = 'none';
            });
        }

        if (btnConfirmYes && confirmModal) {
            btnConfirmYes.addEventListener('click', function () {
                confirmModal.style.display = 'none';

                if (realBtnReset) {
                    const mouseEvt = new MouseEvent('mousedown', {
                        bubbles: true,
                        cancelable: true
                    });
                    const touchEvt = new Event('touchstart', {
                        bubbles: true,
                        cancelable: true
                    });

                    realBtnReset.dispatchEvent(mouseEvt);
                    realBtnReset.dispatchEvent(touchEvt);
                }
            });
        }
    </script>
